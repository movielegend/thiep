<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tết 2026</title>

<!-- Google Font -->
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Be+Vietnam+Pro:wght@400;600;700&display=swap" rel="stylesheet">

<style>
body{
    margin:0;
    overflow:hidden;
    font-family:'Be Vietnam Pro', sans-serif;
}

/* ===== BACKGROUND ===== */
.bg{
    position:fixed;
    width:100%;
    height:100%;
    background:url("Gemini_Generated_Image_r748z5r748z5r748.png") no-repeat center center;
    background-size:cover;
    z-index:0;
}

canvas{
    position:fixed;
    top:0;
    left:0;
    z-index:1;
}

/* ===== NÚT ===== */
.wish-btn{
    position:fixed;
    bottom:30px;
    left:50%;
    transform:translateX(-50%);
    padding:14px 28px;
    font-size:18px;
    font-weight:600;
    background:linear-gradient(45deg,#ffd700,#ffcc00);
    border:none;
    border-radius:30px;
    cursor:pointer;
    z-index:5;
    box-shadow:0 5px 20px rgba(0,0,0,0.4);
    letter-spacing:1px;
}

/* ===== POPUP ===== */
.popup{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.6);
    display:flex;
    justify-content:center;
    align-items:center;
    visibility:hidden;
    opacity:0;
    transition:0.3s;
    z-index:20;
}

.popup.show{
    visibility:visible;
    opacity:1;
}

.popup-content{
    background:linear-gradient(#fff3b0,#ffd700);
    padding:35px;
    border-radius:25px;
    text-align:center;
    max-width:420px;
    box-shadow:0 20px 50px rgba(0,0,0,0.5);
    animation:zoomIn 0.4s ease;
}

@keyframes zoomIn{
    from{transform:scale(0.7);opacity:0;}
    to{transform:scale(1);opacity:1;}
}

.popup h2{
    font-family:'Dancing Script', cursive;
    font-size:34px;
    color:#b30000;
    margin-bottom:15px;
}

.popup p{
    font-size:18px;
    line-height:1.6;
}

.close-btn{
    margin-top:20px;
    padding:8px 16px;
    border:none;
    border-radius:15px;
    background:#d40000;
    color:white;
    cursor:pointer;
}

/* Mobile tối ưu */
@media (max-width:768px){
    .popup-content{
        width:85%;
        padding:25px;
    }
}
</style>
</head>
<body>

<div class="bg"></div>
<canvas id="effects"></canvas>

<!-- Nhạc -->
<audio id="music" autoplay loop>
    <source src="motnammoibinhanh.mp3" type="audio/mpeg">
</audio>

<!-- Nút -->
<button class="wish-btn" onclick="openWish()">Nhận Lời Chúc</button>

<!-- Popup -->
<div class="popup" id="popup">
    <div class="popup-content">
        <h2>🌸 Lời Chúc Năm Mới 🌸</h2>
        <p>
           Chúc bạn năm 2026<br>
          Xuân về vạn điều như ý<br>
          Gia đạo bình an – Phúc lộc đầy nhà<br>
          Sức khỏe dồi dào – Công danh tấn phát<br>
          Hạnh phúc viên mãn – Thành công rực rỡ 🎆

        </p>
        <button class="close-btn" onclick="closeWish()">Đóng</button>
    </div>
</div>

<script>
const canvas=document.getElementById("effects");
const ctx=canvas.getContext("2d");

function resize(){
    canvas.width=window.innerWidth;
    canvas.height=window.innerHeight;
}
window.addEventListener("resize",resize);
resize();

/* ===== PHÁO HOA ===== */
class Firework{
    constructor(x=null,y=null){
        this.x=x ?? Math.random()*canvas.width;
        this.y=canvas.height;
        this.targetY=y ?? Math.random()*canvas.height*0.6;
        this.color=`hsl(${Math.random()*360},100%,60%)`;
        this.exploded=false;
        this.particles=[];
        this.speed=7;
    }
    update(){
        if(!this.exploded){
            this.y-=this.speed;
            if(this.y<=this.targetY){
                this.exploded=true;
                for(let i=0;i<70;i++){
                    this.particles.push(new Particle(this.x,this.y,this.color));
                }
            }
        }
    }
    draw(){
        if(!this.exploded){
            ctx.fillStyle=this.color;
            ctx.beginPath();
            ctx.arc(this.x,this.y,3,0,Math.PI*2);
            ctx.fill();
        }
    }
}

class Particle{
    constructor(x,y,color){
        const angle=Math.random()*Math.PI*2;
        const speed=Math.random()*6+2;
        this.x=x;
        this.y=y;
        this.vx=Math.cos(angle)*speed;
        this.vy=Math.sin(angle)*speed;
        this.life=70;
        this.color=color;
    }
    update(){
        this.x+=this.vx;
        this.y+=this.vy;
        this.vy+=0.05;
        this.life--;
    }
    draw(){
        ctx.globalAlpha=this.life/70;
        ctx.fillStyle=this.color;
        ctx.beginPath();
        ctx.arc(this.x,this.y,2.5,0,Math.PI*2);
        ctx.fill();
        ctx.globalAlpha=1;
    }
}

/* ===== KIM TUYẾN ===== */
class Sparkle{
    constructor(){ this.reset(); }
    reset(){
        this.x=Math.random()*canvas.width;
        this.y=Math.random()*canvas.height;
        this.size=Math.random()*2+1;
        this.speed=Math.random()*1+0.5;
    }
    update(){
        this.y+=this.speed;
        if(this.y>canvas.height) this.reset();
    }
    draw(){
        ctx.fillStyle="gold";
        ctx.beginPath();
        ctx.arc(this.x,this.y,this.size,0,Math.PI*2);
        ctx.fill();
    }
}

let fireworks=[];
let sparkles=Array.from({length:60},()=>new Sparkle());

window.addEventListener("click",(e)=>{
    fireworks.push(new Firework(e.clientX,e.clientY));
});

function animate(){
    ctx.clearRect(0,0,canvas.width,canvas.height);

    if(Math.random()<0.04){
        fireworks.push(new Firework());
    }

    fireworks.forEach((f,i)=>{
        f.update();
        f.draw();
        if(f.exploded){
            f.particles.forEach((p,pi)=>{
                p.update();
                p.draw();
                if(p.life<=0) f.particles.splice(pi,1);
            });
            if(f.particles.length===0) fireworks.splice(i,1);
        }
    });

    sparkles.forEach(s=>{s.update();s.draw();});

    requestAnimationFrame(animate);
}
animate();

/* ===== POPUP ===== */
function openWish(){
    document.getElementById("popup").classList.add("show");
}
function closeWish(){
    document.getElementById("popup").classList.remove("show");
}

/* Mobile autoplay fix */
document.addEventListener("click",()=>{
    document.getElementById("music").play();
},{once:true});
</script>

</body>
</html>
